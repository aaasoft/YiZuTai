<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="30" height="30" opacity="1">
  <!--背景-->
  <rect fill="#FFFFFF" fill-opacity="0" rx="0" ry="0" stroke="#000000" stroke-opacity="0.99609375" stroke-width="0" x="0" y="0" width="30" height="30"></rect>
  <!--圆环-->
  <g>
    <rect width="30" height="30" fill="#35AA47" fill-opacity="0.99609375"></rect>
    <rect width="30" height="15" fill="#EDEBEB" fill-opacity="0.99609375"></rect>
  </g>
  <!--文本-->
  <text fill="#000000" fill-opacity="0.99609375" x="15" y="24" font-size="24" font-family="SimHei" text-anchor="middle" xml:space="preserve">50</text>
</svg>